
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: markethub
      POSTGRES_USER: markethub_user
      POSTGRES_PASSWORD: Database+26
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markethub_user -d markethub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
